<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c10" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Learn & Grow" />
    <meta name="format-detection" content="telephone=no" />

    <meta name="description" content="Learn and Grow: Complete financial markets & cryptocurrency trading academy, live classes, real-time Binance order flow, and verified spot & futures signals by Zia Khan." />

    <meta name="author" content="Zia Khan" />
    <meta name="robots" content="index, follow" />
    
    <!-- PWA Web App Manifest & App Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/pwa-512x512.png" />

    <!-- OpenGraph Social Cards -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Learn and Grow" />
    <meta property="og:title" content="Learn and Grow — Trading, Education, Success" />
    <meta property="og:description" content="Master financial markets with mathematical discipline. Interactive video academy, live trading desk, and verified signals." />
    <meta property="og:image" content="/logo.png" />
    
    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Learn and Grow — Trading, Education, Success" />
    <meta name="twitter:description" content="Master financial markets with mathematical discipline. Interactive video academy, live trading desk, and verified signals." />
    <meta name="twitter:image" content="/logo.png" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Schema.org EducationalOrganization Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "Learn and Grow",
      "alternateName": "Learn and Grow Trading Academy",
      "description": "Professional cryptocurrency and financial markets trading academy providing structured video tracks, live classes, and verified market signals.",
      "logo": "/logo.png",
      "founder": {
        "@type": "Person",
        "name": "Zia Khan"
      },
      "slogan": "Trading • Education • Success",
      "offers": [
        {
          "@type": "Offer",
          "name": "Beginner Track",
          "price": "2",
          "priceCurrency": "USD"
        },
        {
          "@type": "Offer",
          "name": "Advanced VIP Pass",
          "price": "5",
          "priceCurrency": "USD"
        }
      ]
    }
    </script>
  </head>
  <body class="bg-[#090a0f] text-[#ececec] antialiased selection:bg-amber-500 selection:text-black font-sans min-h-screen">
    <div id="root"></div>
